spring.application.name=demo-spring-boot

# PUERTO DE EJECUCION
server.port=8080

# DataSource Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/test-spring-boot
spring.datasource.username=postgres
spring.datasource.password=omardon

# Flyway - Se ejecuta automáticamente al iniciar (autoconfiguration de Spring Boot)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate - NO toca la BD, solo valida
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
